<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Promotions HEI</title>
    <link rel="stylesheet" th:href="@{/assets/promotions.css}">
</head>
<body>

<h1>Promotions</h1>

<table>
    <thead>
    <tr>
        <th>Promotion</th>
        <th>Diplômés</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="year : ${years}">
        <td th:text="${year}">2024</td>
        <td>
            <a class="button"
               th:href="@{/web/promotions/{year}/download(year=${year})}"
                download >
                Télécharger la liste
            </a>
        </td>
    </tr>
    </tbody>
</table>

<p class="empty" th:if="${#lists.isEmpty(years)}">Aucune promotion trouvée.</p>

</body>
</html>
